name: Publish demo to GitHub Pages

# Pages serves the gh-pages branch (auto-enabled when that branch first
# appeared). This workflow regenerates gh-pages from web-demo/ on every
# change, so the live site tracks the repo.

on:
  push:
    branches: [claude/ticket-marketplace-pricing-o13g0i]
    paths:
      - "web-demo/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push web-demo to gh-pages
        run: |
          cd web-demo
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy demo (from ${GITHUB_SHA})"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
